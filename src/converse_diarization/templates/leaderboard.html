  <style>

      display: grid;

<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">Ocular AI Converse</p>
      <h1>Converse-Diarization</h1>
      <p class="lede" id="lede"></p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <main>
    <div class="wrap layout">
      <section>
        <div class="toolbar">
          <div class="views" role="group" aria-label="Metric">
            <button class="pill" type="button" data-metric="der" aria-pressed="true">DER</button>
            <button class="pill" type="button" data-metric="der_collar" aria-pressed="false">DER ±0.25 s collar</button>
            <button class="pill" type="button" data-metric="jer" aria-pressed="false">JER</button>
          </div>
          <div class="views" role="group" aria-label="Overlap tier">
            <button class="ghost" type="button" data-tier="all" aria-pressed="true">All</button>
            <button class="ghost" type="button" data-tier="low" aria-pressed="false">Low overlap</button>
            <button class="ghost" type="button" data-tier="medium" aria-pressed="false">Medium</button>
            <button class="ghost" type="button" data-tier="high" aria-pressed="false">High</button>
          </div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="cols"><span>Model</span><span id="metric-label">DER</span></div>
        <div class="axis" id="axis-top"></div>
        <ol id="list"></ol>
        <div class="axis" id="axis-bottom" style="margin-top:18px;border-top:1px solid var(--line);padding-top:10px"></div>
      </section>
      <aside class="panel" id="panel"></aside>
    </div>
  </main>
  <script>
    const DATA = __PAYLOAD__;
    const BASE_SCALE = 60;
    const METRICS = { der: "DER", der_collar: "DER ±0.25 s collar", jer: "JER" };
    const TIERS = { all: "conversation", low: "low-overlap conversation", medium: "medium-overlap conversation", high: "high-overlap conversation" };
    const plural = (count, noun) => `${count} ${noun}${count === 1 ? "" : "s"}`;
    const SPEAKER_COLORS = ["var(--speaker-a)", "var(--speaker-b)", "#9bb59a", "#b7a3c4", "#c4b48a", "#8fb8b0"];
    const state = { metric: "der", tier: "all", selected: DATA.runs[0] ? DATA.runs[0].id : null, conversation: null, zoom: 1 };

    function pct(number) {
      return number === null || number === undefined ? "n/a" : `${Number(number).toFixed(2)}%`;
    }
    function mmss(seconds, precise) {
      const total = Math.max(0, precise ? Math.round((Number(seconds) || 0) * 10) / 10 : Math.round(Number(seconds) || 0));
      const minutes = Math.floor(total / 60);
      const rest = total - minutes * 60;
      return `${String(minutes).padStart(2, "0")}:${precise ? rest.toFixed(1).padStart(4, "0") : String(rest).padStart(2, "0")}`;
    }
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function selectedRun() {
      return DATA.runs.find((run) => run.id === state.selected) || null;
    }
    function subset(run) {
      return state.tier === "all" ? run.conversations : run.conversations.filter((item) => item.tier === state.tier);
    }
    function pooled(items, key) {
      const sum = (field) => items.reduce((total, item) => total + (item.counts[key][field] || 0), 0);
      const reference = sum("reference_s");
      if (!reference) return { rate: null, breakdown: { missed: null, false_alarm: null, confusion: null } };
      const share = (field) => Math.round((sum(field) / reference) * 10000) / 100;
      return {
        rate: share("errors_s"),
        breakdown: { missed: share("missed_s"), false_alarm: share("false_alarm_s"), confusion: share("confusion_s") },
      };
    }
    function mean(values) {
      const known = values.filter((value) => value !== null && value !== undefined);
      return known.length ? Math.round((known.reduce((a, b) => a + b, 0) / known.length) * 100) / 100 : null;
    }

    // Everything a row shows for one run under the current metric and tier. Null when the tier is empty.
    function measure(run) {
      const items = subset(run);
      if (state.tier === "all") {
        return {
          value: run[state.metric],
          der: run.der,
          jer: run.jer,
          breakdown: state.metric === "der" ? run.breakdown : state.metric === "der_collar" ? run.breakdown_collar : null,
          correct: run.speaker_count.correct || 0,
          total: run.speaker_count.total || run.conversations_scored,
          count: run.conversations_scored,
        };
      }
      if (!items.length) return null;
      const tier = run.tiers[state.tier];
      const der = tier && tier.der !== null && tier.der !== undefined ? { rate: tier.der, breakdown: tier.breakdown } : pooled(items, "der");
      const collar = pooled(items, "der_collar");
      const jer = mean(items.map((item) => item.jer));
      const picked = state.metric === "der" ? der : state.metric === "der_collar" ? collar : { rate: jer, breakdown: null };
      return {
        value: picked.rate,
        der: der.rate,
        jer,
        breakdown: picked.breakdown,
        correct: items.filter((item) => item.speakers.correct).length,
        total: items.length,
        count: items.length,
      };
    }
    function rows() {
      return DATA.runs
        .map((run) => ({ run, measure: measure(run) }))
        .filter((row) => row.measure !== null)
        .sort((a, b) => (b.run.complete - a.run.complete) || ((a.measure.value ?? Infinity) - (b.measure.value ?? Infinity)))
        .map((row, index) => ({ ...row, place: index + 1 }));
    }
    function scaleFor(items) {
      const max = Math.max(BASE_SCALE, ...items.map((row) => row.measure.value || 0));
      return max <= BASE_SCALE ? BASE_SCALE : Math.ceil(max / 10) * 10;
    }
    function axis(scale) {
      const ticks = [0, 1, 2, 3, 4].map((step) => (scale * step) / 4);
      return ticks.map((tick) => {
        const left = (tick / scale) * 100;
        const shift = tick === 0 ? "0" : tick === scale ? "-100%" : "-50%";
        return `<span style="left:${left}%;transform:translateX(${shift})">${Math.round(tick * 10) / 10}%</span>`;
      }).join("");
    }
    function bar(measure, scale) {
      const width = (value) => `${Math.min(100, Math.max(0, ((value || 0) / scale) * 100))}%`;
      if (!measure.breakdown) return `<div class="track"><i class="plain" style="width:${width(measure.value)}"></i></div>`;
      const parts = [["missed", measure.breakdown.missed], ["false-alarm", measure.breakdown.false_alarm], ["confusion", measure.breakdown.confusion]];
      return `<div class="track">${parts.map(([name, value]) => `<i class="${name}" style="width:${width(value)}" title="${name.replace("-", " ")} ${pct(value)}"></i>`).join("")}</div>`;
    }
    function subtitle(run, measure) {
      const scope = state.tier === "all"
        ? (run.conversations_scored < run.conversations_total ? `${run.conversations_scored}/${run.conversations_total} conversations` : plural(run.conversations_scored, "conversation"))
        : plural(measure.count, TIERS[state.tier]);
      const other = state.metric === "jer" ? `DER ${pct(measure.der)}` : `JER ${pct(measure.jer)}`;
      return `${other} · speakers ${measure.correct}/${measure.total} correct · ${scope}`;
    }

    function renderLegend() {
      document.getElementById("legend").innerHTML = state.metric === "jer"
        ? `<span>Mean Jaccard error over reference speakers</span>`
        : `<span style="--swatch:var(--missed)">Missed speech</span><span style="--swatch:var(--false-alarm)">False alarm</span><span style="--swatch:var(--confusion)">Speaker confusion</span><span class="empty" style="--swatch:var(--soft)">Share of reference speaker time</span>`;
    }
    function renderList() {
      const items = rows();
      const scale = scaleFor(items);
      document.getElementById("axis-top").innerHTML = axis(scale);
      document.getElementById("axis-bottom").innerHTML = axis(scale);
      document.getElementById("metric-label").textContent = METRICS[state.metric];
      const list = document.getElementById("list");
      if (!items.length) {
        const why = DATA.runs.length ? `No run has ${TIERS[state.tier]}s.` : "Nothing to rank yet. Score a run and rebuild this page.";
        list.innerHTML = `<li class="row"><p class="empty" style="padding:22px 0">${escapeHtml(why)}</p></li>`;
        return;
      }
      list.innerHTML = items.map(({ run, measure, place }) => `
        <li class="row ${state.selected === run.id ? "is-selected" : ""}">
          <button class="hit" type="button" data-id="${escapeHtml(run.id)}">
            <span class="rank">${String(place).padStart(2, "0")}</span>
            <span class="body">
              <span class="name-line">
                <p><span class="vendor">${escapeHtml(run.vendor)} · </span><span class="name">${escapeHtml(run.display_name)}</span>${run.complete ? "" : `<span class="flag">incomplete</span>`}</p>
                <span class="score">${pct(measure.value)}</span>
              </span>
              ${bar(measure, scale)}
              <p class="sub">${escapeHtml(subtitle(run, measure))}</p>
            </span>
          </button>
        </li>`).join("");
      list.querySelectorAll("button.hit").forEach((button) => {
        button.addEventListener("click", () => {
          if (state.selected !== button.dataset.id) state.conversation = null;
          state.selected = button.dataset.id;
          render();
        });
      });
    }

    function conversationRows(run) {
      const items = subset(run);
      if (!items.length) return `<p class="empty">No ${TIERS[state.tier]}s in this run.</p>`;
      return `<table>
        <thead><tr><th>Conversation</th><th>Overlap</th><th>Tier</th><th>DER</th><th>±0.25 s</th><th>JER</th><th>Spk ref/hyp</th></tr></thead>
        <tbody>${items.map((item) => `
          <tr class="${state.conversation === item.id ? "is-selected" : ""}" data-conversation="${escapeHtml(item.id)}" title="${escapeHtml(item.id)}">
            <td>${escapeHtml(item.id)}</td><td>${pct(item.overlap_ratio)}</td><td>${escapeHtml(item.tier || "")}</td>
            <td>${pct(item.der)}</td><td>${pct(item.der_collar)}</td><td>${pct(item.jer)}</td>
            <td>${item.speakers.reference ?? "?"}/${item.speakers.hypothesis ?? "?"}</td>
          </tr>`).join("")}</tbody></table>`;
    }
    function renderPanel() {
      const panel = document.getElementById("panel");
      const run = selectedRun();
      if (!run) {
        panel.innerHTML = `<p class="empty">No runs yet.</p>`;
        return;
      }
      const items = subset(run);
      if (!items.some((item) => item.id === state.conversation)) state.conversation = items[0] ? items[0].id : null;
      const incomplete = run.complete ? "" : `<p class="warn">Incomplete: ${run.conversations_scored} of ${run.conversations_total} conversations were scored${run.failures ? ` and ${run.failures} failed` : ""}. The score covers the scored conversations only.</p>`;
      panel.innerHTML = `
        <p class="eyebrow">${escapeHtml(DATA.sampleLabel)}</p>
        <h2>${escapeHtml(run.display_name)}</h2>
        <p class="meta">${escapeHtml(run.vendor)} · ${escapeHtml(run.model)}${run.href ? ` · <a href="${escapeHtml(run.href)}">Model site</a>` : ""}</p>
        <div class="kpis">
          <div class="kpi"><b>${pct(run.der)}</b><span>DER</span></div>
          <div class="kpi"><b>${pct(run.der_collar)}</b><span>DER ±0.25 s</span></div>
          <div class="kpi"><b>${pct(run.jer)}</b><span>JER</span></div>
          <div class="kpi"><b>${run.speaker_count.correct ?? 0}/${run.speaker_count.total ?? run.conversations_scored}</b><span>Speaker count</span></div>
        </div>
        <p class="sub">Missed ${pct(run.breakdown.missed)} · false alarm ${pct(run.breakdown.false_alarm)} · confusion ${pct(run.breakdown.confusion)} of ${run.reference_s ? mmss(run.reference_s) : "n/a"} reference speech</p>
        ${incomplete}
        ${conversationRows(run)}
        <div class="timeline" id="timeline"></div>`;
      panel.querySelectorAll("tbody tr").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.conversation = tr.dataset.conversation;
          renderPanel();
        });
      });
      renderTimelineBlock(run);
    }

    // Stretches where two or more reference speakers talk at once.
    function overlaps(segments) {
      const events = [];
      segments.forEach((segment) => { events.push([segment.start_s, 1]); events.push([segment.end_s, -1]); });
      events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const result = [];
      let active = 0;
      let openedAt = null;
      events.forEach(([time, delta]) => {
        active += delta;
        if (active >= 2 && openedAt === null) openedAt = time;
        if (active < 2 && openedAt !== null) { if (time > openedAt) result.push([openedAt, time]); openedAt = null; }
      });
      return result;
    }
    function tickStep(duration, width) {
      const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800];
      return steps.find((step) => (duration / step) * 72 <= width) || steps[steps.length - 1];
    }
    function renderTimelineBlock(run) {
      const block = document.getElementById("timeline");
      const item = run.conversations.find((entry) => entry.id === state.conversation);
      if (!item) { block.innerHTML = ""; return; }
      const refSpeakers = Object.keys(item.speaking_time.reference).sort();
      const letters = refSpeakers.map((_, index) => String.fromCharCode(65 + index));
      block.innerHTML = `
        <h3>Timeline · ${escapeHtml(item.id)}</h3>
        <p class="sub" style="margin:0">${mmss(item.duration_s || 0)} long · overlap ${pct(item.overlap_ratio)} · DER ${pct(item.der)} · JER ${pct(item.jer)}</p>
        <div class="zoom"><span>Zoom</span><input type="range" id="zoom" min="1" max="16" step="1" value="${state.zoom}" aria-label="Timeline zoom" /><span id="zoom-label">${state.zoom}×</span></div>
        <div class="scroller" id="scroller"></div>
        <div class="legend" style="margin:10px 0 0">${letters.map((letter, index) => `<span style="--swatch:${SPEAKER_COLORS[index % SPEAKER_COLORS.length]}">Speaker ${letter}</span>`).join("")}<span class="hatch">Overlapping speech</span><span style="--swatch:var(--unassigned)">Unassigned speaker</span></div>`;
      const slider = document.getElementById("zoom");
      slider.addEventListener("input", () => {
        state.zoom = Number(slider.value);
        document.getElementById("zoom-label").textContent = `${state.zoom}×`;
        drawTimeline(item, refSpeakers, letters);
      });
      drawTimeline(item, refSpeakers, letters);
    }
    function drawTimeline(item, refSpeakers, letters) {
      const scroller = document.getElementById("scroller");
      const duration = Math.max(item.duration_s || 0, ...item.reference_segments.map((s) => s.end_s), ...item.hypothesis_segments.map((s) => s.end_s), 1);
      const gutter = 84;
      const width = Math.max(240, (scroller.clientWidth || 400) - 2) * state.zoom;
      const plot = width - gutter - 8;
      const x = (time) => gutter + (time / duration) * plot;
      const ribbon = 12;
      const colorOf = (index) => SPEAKER_COLORS[index % SPEAKER_COLORS.length];
      const mapping = {};
      item.assignment.forEach(([ref, hyp]) => { mapping[hyp] = ref; });
      const hypSpeakers = Object.keys(item.speaking_time.hypothesis);
      item.hypothesis_segments.forEach((s) => { if (!hypSpeakers.includes(s.speaker)) hypSpeakers.push(s.speaker); });
      const mapped = refSpeakers.map((ref) => hypSpeakers.find((hyp) => mapping[hyp] === ref) || null);
      const extra = hypSpeakers.filter((hyp) => !mapped.includes(hyp)).sort();
      const refTop = 22;
      const refHeight = Math.max(1, refSpeakers.length) * ribbon;
      const hypTop = refTop + refHeight + 26;
      const hypHeight = Math.max(1, refSpeakers.length + extra.length) * ribbon;
      const axisY = hypTop + hypHeight + 18;
      const height = axisY + 20;
      const rect = (segment, y, fill, label) => `<rect x="${x(segment.start_s).toFixed(1)}" y="${y}" width="${Math.max(0.5, x(segment.end_s) - x(segment.start_s)).toFixed(1)}" height="${ribbon - 2}" rx="1" fill="${fill}"><title>${escapeHtml(label)} · ${mmss(segment.start_s, true)}–${mmss(segment.end_s, true)}</title></rect>`;
      const parts = [];
      parts.push(`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(28,27,25,0.08)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(28,27,25,0.55)" stroke-width="2"/></pattern></defs>`);
      parts.push(`<text x="0" y="${refTop + refHeight / 2 + 4}">Reference</text><text x="0" y="${hypTop + hypHeight / 2 + 4}">Prediction</text>`);
      parts.push(`<rect x="${gutter}" y="${refTop - 2}" width="${plot}" height="${refHeight + 2}" fill="var(--soft)"/><rect x="${gutter}" y="${hypTop - 2}" width="${plot}" height="${hypHeight + 2}" fill="var(--soft)"/>`);
      item.reference_segments.forEach((segment) => {
        const index = refSpeakers.indexOf(segment.speaker);
        if (index >= 0) parts.push(rect(segment, refTop + index * ribbon, colorOf(index), `Speaker ${letters[index]} (${segment.speaker})`));
      });
      overlaps(item.reference_segments).forEach(([start, end]) => {
        parts.push(`<rect x="${x(start).toFixed(1)}" y="${refTop - 2}" width="${Math.max(0.5, x(end) - x(start)).toFixed(1)}" height="${refHeight + 2}" fill="url(#hatch)"><title>Overlapping speech · ${mmss(start, true)}–${mmss(end, true)}</title></rect>`);
      });
      item.hypothesis_segments.forEach((segment) => {
        const index = mapped.indexOf(segment.speaker);
        if (index >= 0) {
          parts.push(rect(segment, hypTop + index * ribbon, colorOf(index), `${segment.speaker} → Speaker ${letters[index]}`));
        } else {
          const slot = refSpeakers.length + Math.max(0, extra.indexOf(segment.speaker));
          parts.push(rect(segment, hypTop + slot * ribbon, "var(--unassigned)", `${segment.speaker} (unassigned)`));
        }
      });
      const step = tickStep(duration, plot);
      for (let time = 0; time <= duration + 1e-6; time += step) {
        parts.push(`<line x1="${x(time).toFixed(1)}" y1="${axisY - 6}" x2="${x(time).toFixed(1)}" y2="${axisY}" stroke="var(--line)"/><text x="${x(time).toFixed(1)}" y="${axisY + 13}" text-anchor="${time === 0 ? "start" : "middle"}">${mmss(time)}</text>`);
      }
      scroller.innerHTML = `<svg width="${Math.round(width)}" height="${height}" viewBox="0 0 ${Math.round(width)} ${height}" role="img" aria-label="Reference and predicted speaker timelines">${parts.join("")}</svg>`;
    }

    function renderStats() {
      document.getElementById("lede").textContent = `How accurately speaker-diarization models tell two people apart in real, unscripted American English conversations. Diarization error rate on the mixed Ocular AI Hi-Fi recordings; a lower score is a better segmentation. Every row is a harness run; page built ${DATA.generated}.`;
      const scored = DATA.runs.filter((run) => run.der !== null);
      const complete = scored.filter((run) => run.complete);
      const pool = complete.length ? complete : scored;
      const bestDer = [...pool].sort((a, b) => a.der - b.der)[0];
      const bestJer = [...pool].filter((run) => run.jer !== null).sort((a, b) => a.jer - b.jer)[0];
      const first = DATA.runs[0];
      const stats = [[String(DATA.runs.length), "Models on this page"]];
      if (bestDer) stats.push([pct(bestDer.der), `Lowest DER · ${bestDer.display_name}`]);
      if (bestJer) stats.push([pct(bestJer.jer), `Lowest JER · ${bestJer.display_name}`]);
      if (first) stats.push([String(DATA.dataset.conversations || first.conversations_total), `Conversations · ${((first.reference_s || 0) / 3600).toFixed(1)} h of reference speech`]);
      document.getElementById("stats").innerHTML = stats
        .map(([valueText, label]) => `<div class="stat"><strong>${escapeHtml(valueText)}</strong><span>${escapeHtml(label)}</span></div>`).join("");
    }
    function setPressed() {
      document.querySelectorAll("[data-metric]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.metric === state.metric)));
      document.querySelectorAll("[data-tier]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.tier === state.tier)));
    }
    function render() {
      setPressed();
      renderLegend();
      renderList();
      renderPanel();
    }

    document.querySelectorAll("[data-metric]").forEach((button) => button.addEventListener("click", () => { state.metric = button.dataset.metric; render(); }));
    document.querySelectorAll("[data-tier]").forEach((button) => button.addEventListener("click", () => {
      state.tier = button.dataset.tier;
      const visible = rows();
      if (visible.length && !visible.some((row) => row.run.id === state.selected)) state.selected = visible[0].run.id;
      render();
    }));
    window.addEventListener("resize", () => { const run = selectedRun(); if (run && document.getElementById("scroller")) renderTimelineBlock(run); });
    renderStats();
    render();
  </script>
</body>
</html>
