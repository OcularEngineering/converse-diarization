[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "converse-diarization"
version = "0.1.0"
description = "Ocular AI Converse-Diarization harness: diarize mixed two-speaker Ocular AI conversations with any speaker-diarization model and score DER, JER and speaker count."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Ocular AI" }]
keywords = ["speaker-diarization", "diarization", "benchmark", "der", "jer", "converse", "converse-diarization"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=1.0,<2",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
local = [
  "pyannote.audio>=4.0,<5",
  "torch>=2.4",
  "torchaudio>=2.4",
]

[project.urls]
Homepage = "https://github.com/OcularEngineering/converse-diarization"
Leaderboard = "https://www.useocular.com/converse"

[project.scripts]
converse-diarization = "converse_diarization.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/converse_diarization"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
