# Models the Ocular AI Converse-Diarization harness runs. One table per model.
#
# Two ways to reach a hosted model; mix them freely:
#   via OpenRouter  provider = "openrouter", model = "<vendor>/<id>", one OPENROUTER_API_KEY for all of them.
#                   The vendor's own diarization switch is sent for you (deepgram, azure, elevenlabs,
#                   assemblyai); other vendors need `provider_options = { <slug> = { ... } }`.
#   direct          url + key (the NAME of the variable in .env) against the vendor's own API.
# Optional everywhere: model (defaults to the table name), vendor, display_name, href, notes, provider
# (openai-compatible | openrouter | deepgram | assemblyai | azure | diarizen | elevenlabs | meta | nemo | xai | pyannote | rttm), options.
#
# Shell: converse-diarization models add <name> --openrouter --model <vendor/id>
#    or: converse-diarization models add <name> --url <base url> --key <secret or ENV>

# ---- via OpenRouter -------------------------------------------------------------------

[deepgram-nova-3]
provider = "openrouter"
model = "deepgram/nova-3"
key = "OPENROUTER_API_KEY"
vendor = "Deepgram"
display_name = "Nova-3"
href = "https://openrouter.ai/deepgram/nova-3"
notes = "via OpenRouter"

[elevenlabs-scribe-v2]
provider = "openrouter"
model = "elevenlabs/scribe-v2"
key = "OPENROUTER_API_KEY"
vendor = "ElevenLabs"
display_name = "Scribe v2"
href = "https://openrouter.ai/elevenlabs/scribe-v2"
notes = "via OpenRouter"

[assemblyai-universal-3-5-pro]
provider = "openrouter"
model = "assemblyai/universal-3-5-pro"
key = "OPENROUTER_API_KEY"
vendor = "AssemblyAI"
display_name = "Universal 3.5 Pro"
href = "https://openrouter.ai/assemblyai/universal-3-5-pro"
notes = "via OpenRouter"

# ---- direct ----------------------------------------------------------------------------

[gpt-4o-transcribe-diarize]
url = "https://api.openai.com/v1"
key = "OPENAI_API_KEY"
vendor = "OpenAI"
display_name = "GPT-4o Transcribe Diarize"
href = "https://platform.openai.com/docs/guides/speech-to-text"

[gpt-4o-transcribe-diarize.options]
response_format = "diarized_json"
chunking_strategy = "auto"
upload = "mp3"

[deepgram-nova-3-direct]
url = "https://api.deepgram.com/v1"
key = "DEEPGRAM_API_KEY"
provider = "deepgram"
model = "nova-3"
vendor = "Deepgram"
display_name = "Nova-3 (direct)"
href = "https://developers.deepgram.com/docs/diarization"

[elevenlabs-scribe-v2-direct]
url = "https://api.elevenlabs.io/v1"
key = "ELEVENLABS_API_KEY"
provider = "elevenlabs"
model = "scribe_v2"
vendor = "ElevenLabs"
display_name = "Scribe v2 (direct)"
href = "https://elevenlabs.io/docs/capabilities/speech-to-text"

# ---- local -----------------------------------------------------------------------------

[pyannote-community-1]
provider = "pyannote"
model = "pyannote/speaker-diarization-community-1"
env = ["HF_TOKEN"]                     # gated checkpoint; runs locally after `uv sync --extra local`
vendor = "pyannote"
display_name = "pyannote Community-1"
href = "https://huggingface.co/pyannote/speaker-diarization-community-1"

[pyannote-community-1.options]
device = "auto"

[gemini-3-5-transcribe]
key = "OPENROUTER_API_KEY"
model = "google/gemini-3.5-transcribe"
provider = "openrouter"
vendor = "Google"
display_name = "Gemini 3.5 Transcribe"
href = "https://openrouter.ai/google/gemini-3.5-transcribe"
notes = "via OpenRouter"

[gemini-3-5-transcribe.options]
provider_options = { google-ai-studio = { diarization_mode = "speaker" } }

[grok-stt-1-0]
key = "OPENROUTER_API_KEY"
model = "x-ai/grok-stt-1.0"
provider = "openrouter"
vendor = "xAI"
display_name = "Grok STT 1.0"
href = "https://openrouter.ai/x-ai/grok-stt-1.0"
notes = "via OpenRouter"

[grok-stt-1-0.options]
provider_options = { xai = { diarize = true } }

[grok-voice-transcribe-2-0]
url = "https://api.x.ai/v1"
key = "XAI_API_KEY"
provider = "xai"
model = "grok-voice-transcribe-2.0"
vendor = "xAI"
display_name = "Grok Voice Transcribe 2.0"
href = "https://docs.x.ai/developers/models/grok-voice-transcribe-2.0"
notes = "Word-level speaker labels (diarize = true); same-speaker words up to 0.2 s apart are merged before scoring."

[muse-voice-transcribe-1-0]
url = "https://api.meta.ai/v1"
key = "META_API_KEY"
provider = "meta"
model = "muse-voice-transcribe-1.0"
vendor = "Meta"
display_name = "Muse Voice Transcribe 1.0"
href = "https://dev.meta.ai/docs/speech-to-text"
notes = "Turn-level speakers (mode = DIARIZATION). Mixes are split into 3-minute windows with 30 s of overlap; speakers are linked by who is speaking in that overlap."

[voxtral-mini-transcribe-2]
url = "https://api.mistral.ai/v1"
key = "MISTRAL_API_KEY"
provider = "openai-compatible"
model = "voxtral-mini-2602"
vendor = "Mistral"
display_name = "Voxtral Mini Transcribe 2"
href = "https://docs.mistral.ai/models/voxtral-mini-transcribe-26-02"
notes = "Segment-level speaker labels (diarize = true). Scored as turns, with no word merge."

[voxtral-mini-transcribe-2.options]
diarize = true
timestamp_granularities = ["segment"]
response_format = "verbose_json"
chunking_strategy = ""
language_hint = false

[mai-transcribe-2-direct]
key = "AZURE_FOUNDRY_KEY"
provider = "azure"
model = "mai-transcribe-2"
vendor = "Microsoft"
display_name = "MAI Transcribe 2 (direct)"
href = "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/mai-transcribe"
notes = "Azure Speech fast transcription. Word timestamps inherit the phrase speaker and are merged with the 0.2 s rule. The endpoint is AZURE_FOUNDRY_ENDPOINT; a Foundry project path is ignored."

[mai-transcribe-2-direct.options]
endpoint_env = "AZURE_FOUNDRY_ENDPOINT"

[diarizen-wavlm-large-s80-md-v2]
provider = "diarizen"
model = "BUT-FIT/diarizen-wavlm-large-s80-md-v2"
vendor = "BUT"
display_name = "DiariZen WavLM Large s80 MD v2"
href = "https://huggingface.co/BUT-FIT/diarizen-wavlm-large-s80-md-v2"
notes = "Local DiariZen pipeline. Overlapping turns are kept and scored as segments. Inference uses .cache/diarizen-venv because DiariZen vendors pyannote 3.1."

[diarizen-wavlm-large-s80-md-v2.options]
python = ".cache/diarizen-venv/bin/python"

[nemotron-3-diarization]
provider = "nemo"
model = "nvidia/Nemotron-3-Diarization"
vendor = "NVIDIA"
display_name = "Nemotron 3 Diarization"
href = "https://huggingface.co/nvidia/Nemotron-3-Diarization"
notes = "Local NeMo Sortformer pipeline in .cache/nemotron-venv, offline profile (30.4 s input buffer). Arrival-ordered speaker turns scored as segments; no supplied speaker count."

[nemotron-3-diarization.options]
python = ".cache/nemotron-venv/bin/python"
spkcache_len = 264
fifo_len = 40
chunk_len = 340
chunk_right_context = 40
spkcache_update_period = 300

[qwen3-asr-1-7b-funasr]
provider = "qwen-asr"
model = "Qwen/Qwen3-ASR-1.7B"
vendor = "Alibaba"
display_name = "Qwen3-ASR 1.7B + FunASR speakers"
href = "https://huggingface.co/Qwen/Qwen3-ASR-1.7B"
notes = "Open-weight Qwen3-ASR has no speaker labels of its own; this is Alibaba's FunASR speaker pipeline around it (FSMN-VAD, Qwen3-ForcedAligner word timestamps, CAM++ embeddings clustered into turns), run locally in .cache/qwen-asr-venv. Words take the speaker of their turn and are merged with the 0.2 s rule."

[qwen3-asr-1-7b-funasr.options]
python = ".cache/qwen-asr-venv/bin/python"

[nemotron-3-5-transcribe-30b-a4b]
provider = "nemotron-transcribe"
model = "nvidia/Nemotron-3.5-Transcribe-30B-A4B"
vendor = "NVIDIA"
display_name = "Nemotron 3.5 Transcribe 30B-A4B"
href = "https://huggingface.co/nvidia/Nemotron-3.5-Transcribe-30B-A4B"
notes = "Open-weight speech LLM served through vLLM chat completions with the CTC timestamp middleware; NVIDIA's leaderboard evaluation guide settings (multi-speaker speaker-tag prompt, empty system prompt, no thinking, temperature 0, top-p 1, seed 0, 16,384-token budget, generation-loop cleanup). Scored on the speaker-activity segments the server returns alongside the <spk:N>-tagged transcript, as the model card recommends. The evaluation deployment's gateway drops requests after about a minute, so mixes are split into 8-minute windows with 30 s of overlap and speakers are linked by who is speaking in that overlap."

[nemotron-3-5-transcribe-30b-a4b.options]
upload = "flac"
user_agent = "brev-transcribe-client/1.0"
max_clip_s = 480
window_s = 480
overlap_s = 30
